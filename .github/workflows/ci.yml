name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Race detector butuh cgo, yang tersedia di runner Linux.
      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test -count=1 ./...
